<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 禁用所有缩放，确保摇杆触控准确，支持移动端横竖屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>无人机足球真实模拟挑战</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap');
        
        * { 
            user-select: none; 
            -webkit-user-select: none; 
            /* 移除了这里的 touch-action: none，改到下方精准控制 */
        }

        body {
            font-family: 'Noto Sans SC', 'Orbitron', sans-serif;
            overflow: hidden;
            background-color: #60a5fa; 
            color: #f3f4f6;
        }

        /* 仅对游戏主画面和摇杆层禁用系统手势，保护操作体验 */
        #canvas-container, #joysticks-layer {
            touch-action: none; 
        }

        /* 明确允许输入框、滑动条以及弹出层进行原生触控交互 */
        input, #modal-overlay, .modal-content {
            user-select: auto;
            -webkit-user-select: auto;
            touch-action: auto; 
        }

        /* 顶部赛车仪表盘 UI */
        .top-hud-bar {
            background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0) 100%);
            padding-top: max(15px, env(safe-area-inset-top)); /* 适配刘海屏 */
        }

        .hud-badge {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-top: 4px solid #38bdf8;
            border-radius: 6px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .hud-badge::after {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(56, 189, 248, 0.05) 2px, rgba(56, 189, 248, 0.05) 4px);
            pointer-events: none;
        }

        .joystick-container {
            width: 100px; height: 100px; /* 移动端默认较小，不挡视线 */
            background: rgba(15, 23, 42, 0.5);
            border: 3px solid rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            position: relative;
            cursor: crosshair;
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.2);
            transition: border-color 0.1s, box-shadow 0.1s;
        }

        .joystick-thumb {
            width: 40px; height: 40px;
            background: radial-gradient(circle, #fff 0%, #94a3b8 100%);
            border: 3px solid #38bdf8;
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            transition: border-color 0.1s, transform 0.05s ease-out;
        }

        /* 电脑/平板端放大摇杆 */
        @media (min-width: 640px) {
            .joystick-container { width: 130px; height: 130px; }
            .joystick-thumb { width: 50px; height: 50px; }
        }
        
        .joystick-container.active {
            border-color: #facc15;
            background: rgba(30, 41, 59, 0.7);
            box-shadow: inset 0 0 30px rgba(250, 204, 21, 0.5), 0 0 20px rgba(250, 204, 21, 0.4);
        }
        
        .joystick-container.active .joystick-thumb {
            border-color: #facc15;
            background: radial-gradient(circle, #fff 0%, #fde047 100%);
        }

        /* 关卡卡片效果 */
        .level-card {
            background: linear-gradient(135deg, rgba(30,41,59,0.9), rgba(15,23,42,0.95));
            border: 2px solid #475569;
            border-radius: 12px; transition: all 0.3s ease;
            cursor: pointer; overflow: hidden;
        }
        .level-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3); border-color: #38bdf8; }
        .level-card.selected { border-color: #facc15; box-shadow: 0 0 30px rgba(250, 204, 21, 0.4); }
        .card-img-placeholder { height: 120px; background-size: cover; background-position: center; position: relative; }
        @media (min-width: 640px) { .card-img-placeholder { height: 140px; } }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; touch-action: auto; cursor: pointer; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%;
            background: #facc15; cursor: pointer; margin-top: -10px;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.8); border: 3px solid #fff;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 4px;
        }
        
        .custom-input { background: rgba(0, 0, 0, 0.5); border: 2px solid #475569; color: white; transition: 0.3s;}
        .custom-input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 15px rgba(56,189,248,0.5);}

        .gold-btn {
            background: linear-gradient(180deg, #fef08a 0%, #eab308 100%);
            color: #422006; font-weight: 900; border: 2px solid #fef9c3;
            box-shadow: 0 6px 20px rgba(234, 179, 8, 0.4); transition: all 0.2s;
        }
        .gold-btn:active { transform: translateY(3px); box-shadow: 0 2px 5px rgba(234, 179, 8, 0.4); }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden select-none relative">

    <!-- WebGL Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- UI Overlay HUD -->
    <div class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between">
        
        <!-- TOP HUD (响应式调整 padding 和 font-size) -->
        <div class="top-hud-bar w-full flex justify-between items-start px-2 sm:px-8 pb-4">
            
            <!-- 左侧：积分与高度 -->
            <div class="flex flex-col gap-1 sm:gap-2 pointer-events-auto">
                <div class="hud-badge px-2 sm:px-4 py-1.5 sm:py-2 flex items-center gap-2 sm:gap-3 min-w-[90px] sm:min-w-[140px]">
                    <div class="w-6 h-6 sm:w-10 sm:h-10 rounded-full bg-gradient-to-br from-yellow-300 to-yellow-600 flex items-center justify-center border-2 border-yellow-200">
                        <i class="fa-solid fa-coins text-yellow-900 text-xs sm:text-lg"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] sm:text-xs text-slate-400 font-bold tracking-wider hidden sm:block">总积分</span>
                        <span id="score-display" class="text-lg sm:text-2xl font-black text-yellow-400 font-mono leading-none">0</span>
                    </div>
                </div>
                <div class="hud-badge px-2 sm:px-3 py-1 flex items-center gap-1 sm:gap-2">
                    <i class="fa-solid fa-ruler-vertical text-cyan-400 text-[10px] sm:text-sm"></i>
                    <span class="text-[10px] sm:text-xs text-slate-300 font-bold tracking-wider">H: <span id="alt-display" class="text-white font-mono text-xs sm:text-sm ml-1">0</span>m</span>

            <!-- 中间：核心时间与暂停 -->

                    <!-- 暂停按钮 -->

                <!-- 进度条 -->

                    </div>

            </div>

            <!-- 右侧：速度与关卡 -->

                <div class="hud-badge px-2 sm:px-4 py-1.5 sm:py-2 flex items-center gap-2 sm:gap-3 min-w-[80px] sm:min-w-[140px] flex-row-reverse">

                 <div class="hud-badge px-2 sm:px-3 py-1 flex items-center gap-1 sm:gap-2">
                    <span class="text-[10px] sm:text-xs text-slate-300 font-bold tracking-wider">V: <span id="speed-display" class="text-green-400 font-mono text-xs sm:text-sm ml-1">0</span>km/h</span>

        </div>

        <div class="flex flex-col justify-end p-2 sm:p-6 gap-2 sm:gap-4 w-full h-full pointer-events-none pb-[env(safe-area-inset-bottom)]">
            <div class="flex justify-between items-end w-full relative h-full">

                        <span id="hover-text" class="hidden md:inline">一键悬停 (Space)</span>

                    <button id="btn-reset-pos" class="hud-badge px-3 py-2 sm:px-4 sm:py-3 hover:bg-white/10 transition flex items-center justify-center gap-2 text-xs sm:text-sm font-bold text-white active:scale-95 border-t-amber-400">
                        <i class="fa-solid fa-rotate-left text-amber-400 text-sm sm:text-lg"></i>

                        <div class="text-[10px] sm:text-sm font-bold text-white bg-slate-900/90 px-2 sm:px-4 py-1 sm:py-1.5 rounded-full border border-slate-600 shadow-lg tracking-widest hidden sm:block">升降 / 偏航</div>
                        <div id="joystick-left" class="joystick-container"><div id="thumb-left" class="joystick-thumb"></div></div>
                    </div>
                    <div class="flex flex-col items-center gap-1 sm:gap-3 opacity-95 pointer-events-auto">

                    <button id="btn-audio" class="hud-badge px-3 py-2 sm:px-4 sm:py-3 hover:bg-white/10 transition flex items-center justify-center gap-2 text-xs sm:text-sm font-bold text-white active:scale-95">

                    </button>
                </div>
            </div>
        </div>

    <!-- 暂停遮罩层 -->

        <div class="text-center bg-slate-900/90 p-8 sm:p-12 rounded-2xl border border-slate-600 shadow-2xl">

                        <div class="z-10 text-center mt-auto mb-2 sm:mb-4">
                            <span class="bg-red-600 text-white text-[10px] sm:text-xs font-bold px-2 py-1 sm:px-3 sm:py-1.5 rounded-full tracking-widest shadow-lg">完整 3 关卡联赛</span>

                    进入下一关 <i class="fa-solid fa-forward-fast ml-2"></i>
                </button>

    <!-- MAIN GAME SCRIPT -->
    <script>
        class SoundEngine {
            constructor() { this.ctx = null; this.isMuted = false; this.engineOsc = null; this.engineGain = null; }
            init() {
                if (this.ctx) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
                this.engineOsc = this.ctx.createOscillator();
                this.engineGain = this.ctx.createGain();
                this.engineOsc.type = 'sawtooth';
                this.engineOsc.frequency.setValueAtTime(60, this.ctx.currentTime); 
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(320, this.ctx.currentTime);
                this.engineOsc.connect(filter); filter.connect(this.engineGain); this.engineGain.connect(this.ctx.destination);
                this.engineGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                this.engineOsc.start();
            }
            updateEngine(speedRatio) {
                if (!this.ctx || this.isMuted) return;
                const baseFreq = 60 + speedRatio * 80;
                const baseGain = 0.01 + speedRatio * 0.03;
                this.engineOsc.frequency.setTargetAtTime(baseFreq, this.ctx.currentTime, 0.1);
                this.engineGain.gain.setTargetAtTime(baseGain, this.ctx.currentTime, 0.1);
            }
            playBeep(freq, type, duration, vol) {
                if (!this.ctx || this.isMuted) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(vol, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + duration + 0.1);
            }
            playPassRing() { this.playBeep(880, 'sine', 0.3, 0.3); setTimeout(()=>this.playBeep(1046, 'sine', 0.4, 0.3), 100); }
            playHit() { this.playBeep(120, 'square', 0.2, 0.4); }

                return this.isMuted;
            }
        }

        function createRealStadium() {
            // 真实草皮
            const grassCanvas = document.createElement('canvas');
            grassCanvas.width = 512; grassCanvas.height = 512;
            const ctx = grassCanvas.getContext('2d');
            ctx.fillStyle = '#166534'; ctx.fillRect(0,0,512,512);
            ctx.fillStyle = '#15803d'; for(let i=0; i<512; i+=64) ctx.fillRect(0, i, 512, 32);
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6;
            ctx.strokeRect(32, 32, 448, 448);
            ctx.beginPath(); ctx.moveTo(32, 256); ctx.lineTo(480, 256); ctx.stroke();
            ctx.beginPath(); ctx.arc(256, 256, 60, 0, Math.PI*2); ctx.stroke();
            
            const grassTex = new THREE.CanvasTexture(grassCanvas);
            grassTex.wrapS = THREE.RepeatWrapping; grassTex.wrapT = THREE.RepeatWrapping;
            grassTex.repeat.set(2, 40);

            const groundGeo = new THREE.PlaneGeometry(100, 2000);
            const groundMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1.0 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = 900; 
            ground.receiveShadow = true;
            scene.add(ground);

            // 起飞停机坪 H
            const padCanvas = document.createElement('canvas');
            padCanvas.width = 256; padCanvas.height = 256;
            const pCtx = padCanvas.getContext('2d');
            pCtx.fillStyle = '#1e293b'; pCtx.beginPath(); pCtx.arc(128, 128, 120, 0, Math.PI*2); pCtx.fill();
            pCtx.lineWidth = 15;
            for(let i=0; i<360; i+=15) {
                pCtx.strokeStyle = (i%30===0) ? '#facc15' : '#0f172a';
                pCtx.beginPath(); pCtx.arc(128, 128, 110, i*Math.PI/180, (i+15)*Math.PI/180); pCtx.stroke();
            }
            pCtx.fillStyle = '#facc15'; pCtx.font = '900 120px "Orbitron"';
            pCtx.textAlign = 'center'; pCtx.textBaseline = 'middle';
            pCtx.fillText('H', 128, 135);
            const padMat = new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(padCanvas), transparent: true });
            const pad = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), padMat);
            pad.rotation.x = -Math.PI / 2; pad.position.set(0, 0.05, 0); 
            scene.add(pad);

            // 看台
            const standGeo = new THREE.BoxGeometry(20, 4, 2000);
            const redMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const blueMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
            for(let i=0; i<6; i++) {
                const yPos = 2 + i * 4; const offset = 50 + i * 5;
                const mat = (i%2===0) ? blueMat : redMat;
                const lStand = new THREE.Mesh(standGeo, mat); lStand.position.set(-offset, yPos, 900); scene.add(lStand);
                const rStand = new THREE.Mesh(standGeo, mat); rStand.position.set(offset, yPos, 900); scene.add(rStand);
            }

            // 广告牌复用优化
            const BILLBOARD_TEXTS = ["HARC无人机足球", "竞技训练场欢迎您"];
            const adMaterials = BILLBOARD_TEXTS.map(text => {
                const bCanvas = document.createElement('canvas'); bCanvas.width = 1024; bCanvas.height = 256;
                const bCtx = bCanvas.getContext('2d');
                bCtx.fillStyle = '#0f172a'; bCtx.fillRect(0,0,1024,256);
                bCtx.strokeStyle = '#facc15'; bCtx.lineWidth = 8; bCtx.strokeRect(4,4,1016,248);
                bCtx.fillStyle = '#ffffff'; bCtx.font = '900 80px "Noto Sans SC"';
                bCtx.textAlign = 'center'; bCtx.textBaseline = 'middle';
                bCtx.fillText(text, 512, 128);
                return new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(bCanvas) });
            });
            const bGeo = new THREE.BoxGeometry(80, 16, 2);
            for(let i=0; i<16; i++) {
                const board = new THREE.Mesh(bGeo, adMaterials[i % adMaterials.length]);
                const isLeft = i%2 === 0;
                board.position.set(isLeft ? -48 : 48, 8, i*100 + 50);
                board.rotation.y = isLeft ? Math.PI/2 : -Math.PI/2;
                scene.add(board);
            }
        }

        function createRealisticDrone() {
            droneGroup = new THREE.Group();

            // 红色球形防护罩外骨骼
            const cageMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4 });
            const R = CONFIG.DRONE_RADIUS; const tubeR = 0.08;
            
            const hRing = new THREE.Mesh(new THREE.TorusGeometry(R, tubeR, 8, 24), cageMat);
            hRing.rotation.x = Math.PI/2; droneGroup.add(hRing);

            for(let i=0; i<4; i++) {
                const vRing = new THREE.Mesh(new THREE.TorusGeometry(R, tubeR, 8, 24), cageMat);
                vRing.rotation.y = (Math.PI / 4) * i; droneGroup.add(vRing);
            }

            const latRadius = R * Math.cos(Math.PI/4); const latY = R * Math.sin(Math.PI/4);
            const topRing = new THREE.Mesh(new THREE.TorusGeometry(latRadius, tubeR, 8, 24), cageMat);
            topRing.position.y = latY; topRing.rotation.x = Math.PI/2; droneGroup.add(topRing);
            const bottomRing = new THREE.Mesh(new THREE.TorusGeometry(latRadius, tubeR, 8, 24), cageMat);
            bottomRing.position.y = -latY; bottomRing.rotation.x = Math.PI/2; droneGroup.add(bottomRing);

            // 核心十字支架与球
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            const crossGeo = new THREE.BoxGeometry(R*1.6, 0.08, 0.15);
            const frame1 = new THREE.Mesh(crossGeo, frameMat); frame1.rotation.y = Math.PI/4; droneGroup.add(frame1);
            const frame2 = new THREE.Mesh(crossGeo, frameMat); frame2.rotation.y = -Math.PI/4; droneGroup.add(frame2);
            
            const core = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8 }));
            droneGroup.add(core);

            // 螺旋桨
            propellers = [];
            const propGeo = new THREE.BoxGeometry(1.2, 0.02, 0.12);
            const propMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const offsets = [[R*0.5, R*0.5], [-R*0.5, R*0.5], [R*0.5, -R*0.5], [-R*0.5, -R*0.5]];
            offsets.forEach(pos => {
                const prop = new THREE.Mesh(propGeo, propMat);
                prop.position.set(pos[0], 0.2, pos[1]);
                droneGroup.add(prop); propellers.push(prop);
            });

            // 指示灯
            const tailLight = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({color: 0xff0000}));
            tailLight.position.set(0, 0, -R + 0.2); droneGroup.add(tailLight);

            droneGroup.traverse(child => { if(child.isMesh) child.castShadow = true; });
            scene.add(droneGroup);
        }

        function generateRings() {
            // 清理旧内存
            ringsList.forEach(r => {
                if(r.mesh) {
                    scene.remove(r.mesh);
                    r.mesh.traverse(child => {
                        if (child.isMesh) {
                            if (child.geometry) child.geometry.dispose();
                            if (child.material) child.material.dispose();
                        }
                    });
                }
            });
            ringsList = [];
            
            let currentZ = 40;
            for (let i = 0; i < CONFIG.RINGS_PER_LEVEL; i++) {
                currentZ += CONFIG.RING_SPACING;
                const ringGroup = new THREE.Group();
                const isFinal = (i === CONFIG.RINGS_PER_LEVEL - 1);
                const color = isFinal ? 0xfacc15 : (i%2===0 ? 0xffffff : 0x38bdf8);
                
                const torus = new THREE.Mesh(new THREE.TorusGeometry(CONFIG.RING_RADIUS, 0.5, 8, 16), new THREE.MeshStandardMaterial({ color: color }));
                torus.castShadow = true; ringGroup.add(torus);
                
                const inner = new THREE.Mesh(new THREE.CircleGeometry(CONFIG.RING_RADIUS - 0.5, 16), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.15, side: THREE.DoubleSide }));
                ringGroup.add(inner);

                let posX = (Math.random() - 0.5) * 20; let posY = 5 + Math.random() * 10;
                ringGroup.position.set(posX, posY, currentZ); scene.add(ringGroup);
                ringsList.push({ mesh: ringGroup, torus: torus, inner: inner, passed: false, index: i, initialPos: new THREE.Vector3(posX, posY, currentZ), isFinal: isFinal });
            }
        }

        function setupJoystick(elId, thumbId, stateObj) {
            const el = document.getElementById(elId);
            const thumb = document.getElementById(thumbId);
            if(!el) return;

            const updatePos = (e) => {
                const rect = el.getBoundingClientRect();
                const r = rect.width/2 - thumb.offsetWidth/2; 
                let dx = e.clientX - (rect.left + rect.width/2);
                let dy = e.clientY - (rect.top + rect.height/2);
                const dist = Math.hypot(dx,dy);
                if(dist>r) { dx = (dx/dist)*r; dy = (dy/dist)*r; }
                stateObj.x = dx/r; stateObj.y = dy/r;
                thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            };

            el.addEventListener('pointerdown', (e) => {
                el.setPointerCapture(e.pointerId);
                stateObj.active = true; stateObj.pointerId = e.pointerId;
                el.classList.add('active'); updatePos(e);
            });

            el.addEventListener('pointermove', (e) => {
                if (!stateObj.active || e.pointerId !== stateObj.pointerId) return;
                updatePos(e);
            });

            const endDrag = (e) => {
                if (e.pointerId === stateObj.pointerId) {
                    el.releasePointerCapture(e.pointerId);
                    stateObj.active = false; stateObj.x = 0; stateObj.y = 0; stateObj.pointerId = null;
                    el.classList.remove('active'); thumb.style.transform = 'translate(-50%, -50%)';
                }
            };

            el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', endDrag);
        }

        function updatePhysics(delta) {
            if(!gameState.active || gameState.isPaused) return;

            gameState.timeLeft -= delta;
            const timeEl = document.getElementById('time-display');
            timeEl.textContent = Math.max(0, gameState.timeLeft).toFixed(1) + 's';
            timeEl.style.color = gameState.timeLeft <= 10 ? '#ef4444' : '#ffffff';
            
            if(gameState.timeLeft <= 0) { endGame(false); return; }
            if(dronePhysics.hitTimer > 0) dronePhysics.hitTimer -= delta;

            let altInput = (keys.w?1:0) - (keys.s?1:0) - touchInput.left.y;
            let pitchInput = (keys.ArrowUp?1:0) - (keys.ArrowDown?1:0) - touchInput.right.y;
            let rollInput = (keys.ArrowRight?1:0) - (keys.ArrowLeft?1:0) + touchInput.right.x;

            if((Math.abs(altInput)>0.1 || Math.abs(pitchInput)>0.1 || Math.abs(rollInput)>0.1) && dronePhysics.isHovering) toggleHover();

            const accel = 60 * delta; 
            
            if(dronePhysics.isHovering) {
                dronePhysics.vel.lerp(new THREE.Vector3(0,0,0), 0.1);
                dronePhysics.targetPitch = THREE.MathUtils.lerp(dronePhysics.targetPitch, 0, 0.1);
                dronePhysics.targetRoll = THREE.MathUtils.lerp(dronePhysics.targetRoll, 0, 0.1);
            } else {
                // 完全手动：摇杆推力决定前后速度
                if(Math.abs(pitchInput) > 0.05) {
                    dronePhysics.vel.z += pitchInput * accel * 1.8; 
                    dronePhysics.targetPitch = THREE.MathUtils.lerp(dronePhysics.targetPitch, 0.4 * pitchInput, 0.1);
                } else dronePhysics.targetPitch = THREE.MathUtils.lerp(dronePhysics.targetPitch, 0, 0.1);

                if(Math.abs(rollInput) > 0.05) {
                    dronePhysics.vel.x -= rollInput * accel * 1.5; 
                    dronePhysics.targetRoll = THREE.MathUtils.lerp(dronePhysics.targetRoll, 0.4 * rollInput, 0.1);
                } else dronePhysics.targetRoll = THREE.MathUtils.lerp(dronePhysics.targetRoll, 0, 0.1);

                dronePhysics.vel.y += altInput * accel * 1.5;
            }

            dronePhysics.vel.multiplyScalar(0.94); // 惯性衰减
            dronePhysics.pos.addScaledVector(dronePhysics.vel, delta);
            dronePhysics.pos.y = Math.max(0.5, Math.min(dronePhysics.pos.y, 40));
            dronePhysics.pos.x = Math.max(-45, Math.min(dronePhysics.pos.x, 45));
            dronePhysics.pitch += (dronePhysics.targetPitch - dronePhysics.pitch) * 0.1;
            dronePhysics.roll += (dronePhysics.targetRoll - dronePhysics.roll) * 0.1;
            
            droneGroup.position.copy(dronePhysics.pos);
            droneGroup.rotation.set(dronePhysics.pitch, 0, dronePhysics.roll);
            propellers.forEach((p, idx) => p.rotation.y += (idx%2===0?1:-1)*1.5); 
            
            const speed = dronePhysics.vel.length();
            gameState.speed = speed * 15;
            camera.position.lerp(dronePhysics.pos.clone().add(new THREE.Vector3(0, 4, -15 - speed*0.1)), 0.1);
            camera.lookAt(dronePhysics.pos.clone().add(new THREE.Vector3(0,0,30)));
            sound.updateEngine(Math.min(speed/30, 1));

            document.getElementById('speed-display').textContent = Math.round(gameState.speed);
            document.getElementById('alt-display').textContent = dronePhysics.pos.y.toFixed(1);

            checkCollisions();
        }

        function checkCollisions() {
            if(dronePhysics.hitTimer > 0) return;
            ringsList.forEach(ring => {
                if(!gameState.isFreshmanMode) ring.mesh.position.x = ring.initialPos.x + Math.sin(Date.now()*0.002 + ring.index) * (gameState.level * 3);
                if(ring.passed) return;

                const distZ = Math.abs(dronePhysics.pos.z - ring.mesh.position.z);
                const xyDist = Math.hypot(dronePhysics.pos.x - ring.mesh.position.x, dronePhysics.pos.y - ring.mesh.position.y);

                if(distZ < 3.0) {
                    if(xyDist < CONFIG.RING_RADIUS) {
                        ring.passed = true; gameState.ringsCleared++; gameState.score += 100;
                        ring.torus.material.color.setHex(0x4ade80); ring.inner.material.opacity = 0.5;
                        sound.playPassRing(); updateHUD();
                        if(gameState.ringsCleared >= CONFIG.RINGS_PER_LEVEL) levelComplete();
                    } else if(xyDist < CONFIG.RING_RADIUS + 3.0) {
                        sound.playHit(); dronePhysics.hitTimer = 0.5; dronePhysics.vel.z = -15; 
                        const angle = Math.atan2(dronePhysics.pos.y - ring.mesh.position.y, dronePhysics.pos.x - ring.mesh.position.x);
                        dronePhysics.vel.x = Math.cos(angle) * 15; dronePhysics.vel.y = Math.sin(angle) * 15;
                        const origC = ring.torus.material.color.getHex(); ring.torus.material.color.setHex(0xff0000);
                        setTimeout(() => { if(!ring.passed) ring.torus.material.color.setHex(origC); }, 300);
                    }
                }
            });
        }

        function updateHUD() {

            document.getElementById('ring-progress-bar').style.width = `${(gameState.ringsCleared/CONFIG.RINGS_PER_LEVEL)*100}%`;
            document.getElementById('stage-display').textContent = `${gameState.level}/${gameState.isFreshmanMode ? 1 : 3}`;
        }

        function levelComplete() {
            gameState.active = false; sound.playLevelUp();
            gameState.score += Math.floor(gameState.timeLeft) * 20; 
            if(gameState.isFreshmanMode || gameState.level >= 3) endGame(true);
            else {
                gameState.level++; gameState.ringsCleared = 0;
                document.getElementById('setup-panel').classList.add('hidden');
                document.getElementById('mode-select-container').classList.add('hidden');
                document.getElementById('modal-title').textContent = `关卡 ${gameState.level-1} 突破完成！`;
                document.getElementById('modal-subtitle').innerHTML = `获得时间奖励积分，准备进入更难的关卡 ${gameState.level}`;
                document.getElementById('btn-start-game').classList.add('hidden');
                document.getElementById('btn-next-level').classList.remove('hidden');
                document.getElementById('modal-overlay').classList.remove('hidden');
            }
        }

        function endGame(success) {
            gameState.active = false; if(!success) sound.playHit();
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = success ? '竞速挑战成功！' : '时间耗尽，行动失败';
            document.getElementById('modal-title').className = success ? "text-2xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600 tracking-wider mb-2 drop-shadow-md" : "text-2xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-rose-600 tracking-wider mb-2 drop-shadow-md";
            
            document.getElementById('setup-panel').classList.remove('hidden');
            document.getElementById('mode-select-container').classList.remove('hidden');
            document.getElementById('btn-start-game').classList.remove('hidden');
            document.getElementById('btn-next-level').classList.add('hidden');
            modal.classList.remove('hidden');
            if(success) confetti({particleCount: 150, spread: 80, origin: {y:0.6}, colors: ['#facc15', '#38bdf8', '#fb7185']});
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics(Math.min(clock.getDelta(), 0.1));
            if(gameState.isPaused && droneGroup) propellers.forEach((p, idx) => p.rotation.y += (idx%2===0?1:-1)*0.05); 
            renderer.render(scene, camera);
        }

        window.onload = () => { initThreeScene(); selectMode(false); animate(); };
    </script>
</body>
</html>
