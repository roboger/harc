<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>无人机足球真实模拟挑战</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap');
        
        * { user-select: none; -webkit-user-select: none; touch-action: manipulation; }

        body {
            font-family: 'Noto Sans SC', 'Orbitron', sans-serif;
            overflow: hidden; background-color: #0f172a; color: #f3f4f6;
        }

        /* 仅锁定摇杆和画面的手势，放过UI弹窗滑动 */
        #canvas-container, #joysticks-layer { touch-action: none; }
        input[type="range"], input[type="text"], #modal-overlay, .modal-content { touch-action: auto; user-select: auto; -webkit-user-select: auto; }

        .top-hud-bar {
            background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0) 100%);
            padding-top: max(15px, env(safe-area-inset-top));
        }

        .hud-badge {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-top: 4px solid #38bdf8;
            border-radius: 6px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }

        .hud-badge::after {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(56, 189, 248, 0.05) 2px, rgba(56, 189, 248, 0.05) 4px);
            pointer-events: none;
        }

        .joystick-container {
            width: 100px; height: 100px;
            background: rgba(15, 23, 42, 0.5);
            border: 3px solid rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(8px); border-radius: 50%;
            position: relative; cursor: crosshair;
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.2);
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .joystick-thumb {
            width: 40px; height: 40px;
            background: radial-gradient(circle, #fff 0%, #94a3b8 100%);
            border: 3px solid #38bdf8; border-radius: 50%;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none; box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            transition: border-color 0.15s, background 0.15s, transform 0.05s ease-out;
        }

        @media (min-width: 640px) {
            .joystick-container { width: 130px; height: 130px; }
            .joystick-thumb { width: 50px; height: 50px; }
        }
        
        /* 摇杆按下时的金色高亮视觉反馈 */
        .joystick-container.active {
            border-color: #facc15; background: rgba(30, 41, 59, 0.8);
            box-shadow: inset 0 0 30px rgba(250, 204, 21, 0.5), 0 0 20px rgba(250, 204, 21, 0.4);
        }
        .joystick-container.active .joystick-thumb {
            border-color: #facc15; background: radial-gradient(circle, #fff 0%, #fde047 100%);
            transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 5px 25px rgba(250, 204, 21, 0.8);
        }

        /* 手机竖屏排版优化 */
        @media (orientation: portrait) {
            .top-hud-bar { flex-wrap: wrap; justify-content: space-between; }
            .hud-left { order: 1; width: 48%; }
            .hud-right { order: 2; width: 48%; display: flex; flex-direction: column; align-items: flex-end; }
            .hud-center { order: 3; width: 100%; margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
            #joysticks-layer { padding-bottom: 12vh; px: 1rem; }
        }

        .level-card {
            background: linear-gradient(135deg, rgba(30,41,59,0.9), rgba(15,23,42,0.95));
            border: 2px solid #475569; border-radius: 12px; transition: all 0.3s ease;
            cursor: pointer; overflow: hidden;
        }
        .level-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3); border-color: #38bdf8; }
        .level-card.selected { border-color: #facc15; box-shadow: 0 0 30px rgba(250, 204, 21, 0.4); }
        .card-img-placeholder { height: 120px; background-size: cover; background-position: center; position: relative; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%;
            background: #facc15; cursor: pointer; margin-top: -10px;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.8); border: 3px solid #fff;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 4px;
        }
        
        .custom-input { background: rgba(0, 0, 0, 0.5); border: 2px solid #475569; color: white; transition: 0.3s;}
        .custom-input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 15px rgba(56,189,248,0.5);}

        .gold-btn {
            background: linear-gradient(180deg, #fef08a 0%, #eab308 100%);
            color: #422006; font-weight: 900; border: 2px solid #fef9c3;
            box-shadow: 0 6px 20px rgba(234, 179, 8, 0.4); transition: all 0.2s;
        }
        .gold-btn:active { transform: translateY(3px); box-shadow: 0 2px 5px rgba(234, 179, 8, 0.4); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden select-none relative">

    <!-- Toast 通知容器 -->
    <div id="toast-container" class="fixed top-10 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- 游戏主画面 -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <div class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between">
        <!-- 响应式 HUD 面板 -->
        <div class="top-hud-bar w-full flex justify-between items-start px-2 sm:px-8 pb-4">
            
            <div class="hud-left flex flex-col gap-1 sm:gap-2 pointer-events-auto">
                <div class="hud-badge px-2 sm:px-4 py-1.5 sm:py-2 flex items-center gap-2 sm:gap-3">
                    <div class="w-6 h-6 sm:w-10 sm:h-10 rounded-full bg-gradient-to-br from-yellow-300 to-yellow-600 flex items-center justify-center border-2 border-yellow-200">
                        <i class="fa-solid fa-coins text-yellow-900 text-xs sm:text-lg"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] sm:text-xs text-slate-400 font-bold tracking-wider hidden sm:block">总积分</span>
                        <span id="score-display" class="text-lg sm:text-2xl font-black text-yellow-400 font-mono leading-none">0</span>
                    </div>
                </div>
                <div class="hud-badge px-2 sm:px-3 py-1 flex items-center gap-1 sm:gap-2 w-max">
                    <i class="fa-solid fa-ruler-vertical text-cyan-400 text-[10px] sm:text-sm"></i>
                    <span class="text-[10px] sm:text-xs text-slate-300 font-bold tracking-wider">高度: <span id="alt-display" class="text-white font-mono text-xs sm:text-sm ml-1">0.0</span>m</span>
                </div>
            </div>

            <div class="hud-center flex flex-col items-center pointer-events-auto mt-1 sm:mt-0">
                <div class="flex items-center gap-1 sm:gap-2">
                    <div class="hud-badge px-3 sm:px-8 py-1.5 sm:py-2 flex items-center gap-2 sm:gap-4 border-t-4 border-t-yellow-400 bg-slate-900/95">
                        <i class="fa-regular fa-clock text-xl sm:text-3xl text-slate-300"></i>
                        <span id="time-display" class="text-2xl sm:text-4xl font-black text-white font-mono tracking-widest drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">60.0s</span>
                    </div>
                    <button id="btn-pause" class="hud-badge w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center hover:bg-white/10 transition active:scale-95 border-t-white" title="暂停 (P)">
                        <i class="fa-solid fa-pause text-white text-base sm:text-xl"></i>
                    </button>
                </div>
                <div class="mt-1.5 sm:mt-3 flex items-center gap-1 sm:gap-3 bg-slate-900/80 px-2 sm:px-4 py-1 sm:py-1.5 rounded-full border border-slate-600 backdrop-blur-md">
                    <span class="text-[10px] sm:text-xs font-bold text-cyan-400 uppercase tracking-widest hidden sm:inline">关卡进度</span>
                    <i class="fa-solid fa-bullseye text-cyan-400 text-[10px] sm:hidden"></i>
                    <div class="w-24 sm:w-32 bg-gray-800 h-1.5 sm:h-2.5 rounded-full overflow-hidden shadow-inner">
                        <div id="ring-progress-bar" class="bg-gradient-to-r from-cyan-400 to-blue-500 h-full w-0 transition-all duration-300"></div>
                    </div>
                    <span class="text-xs sm:text-sm font-mono font-black text-white"><span id="rings-count">0</span><span class="text-slate-500 text-[10px] sm:text-xs">/10</span></span>
                </div>
            </div>

            <div class="hud-right flex flex-col gap-1 sm:gap-2 items-end pointer-events-auto">
                <div class="hud-badge px-2 sm:px-4 py-1.5 sm:py-2 flex items-center gap-2 sm:gap-3 flex-row-reverse">
                    <div class="w-6 h-6 sm:w-10 sm:h-10 rounded-full bg-gradient-to-br from-red-400 to-red-600 flex items-center justify-center border-2 border-red-200">
                        <i class="fa-solid fa-flag-checkered text-white text-xs sm:text-lg"></i>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-[10px] sm:text-xs text-slate-400 font-bold tracking-wider hidden sm:block">当前阶段</span>
                        <span id="stage-display" class="text-lg sm:text-2xl font-black text-white font-mono leading-none">1/3</span>
                    </div>
                </div>
                 <div class="hud-badge px-2 sm:px-3 py-1 flex items-center gap-1 sm:gap-2 w-max">
                    <span class="text-[10px] sm:text-xs text-slate-300 font-bold tracking-wider">速度: <span id="speed-display" class="text-green-400 font-mono text-xs sm:text-sm ml-1">0</span>km/h</span>
                </div>
            </div>
        </div>

        <!-- 底部控制栏 -->
        <div class="flex flex-col justify-end p-2 sm:p-6 gap-2 w-full h-full pointer-events-none pb-[env(safe-area-inset-bottom)]">
            <div class="flex justify-between items-end w-full relative h-full">
                 
                 <!-- 辅助按钮 -->
                 <div class="flex flex-col gap-2 pointer-events-auto z-30 pb-2 pl-1 sm:pl-0">
                    <button id="btn-hover" class="hud-badge px-3 py-2 sm:px-4 sm:py-3 hover:bg-white/10 transition flex items-center justify-center gap-2 text-xs sm:text-sm font-bold text-white active:scale-95 border-t-pink-400 shadow-[0_0_15px_rgba(244,114,182,0.3)]">
                        <i id="hover-icon" class="fa-solid fa-hand-paper text-pink-400"></i>
                        <span id="hover-text" class="hidden md:inline">一键悬停</span>
                    </button>
                    <button id="btn-reset-pos" class="hud-badge px-3 py-2 sm:px-4 sm:py-3 hover:bg-white/10 transition flex items-center justify-center gap-2 text-xs sm:text-sm font-bold text-white active:scale-95 border-t-amber-400 shadow-[0_0_15px_rgba(251,191,36,0.3)]">
                        <i class="fa-solid fa-rotate-left text-amber-400"></i>
                        <span class="hidden md:inline">返回起点</span>
                    </button>
                </div>

                <div id="joysticks-layer" class="absolute bottom-0 inset-x-0 flex justify-between items-end pointer-events-none px-4 sm:px-32 md:px-48 z-10 pb-4">
                    <div class="flex flex-col items-center gap-1 sm:gap-3 opacity-95 pointer-events-auto">
                        <div class="text-[10px] sm:text-sm font-bold text-white bg-slate-900/90 px-2 py-1 rounded-full border border-slate-600 shadow-lg tracking-widest hidden sm:block">升降 / 偏航</div>
                        <div id="joystick-left" class="joystick-container"><div id="thumb-left" class="joystick-thumb"></div></div>
                    </div>
                    <div class="flex flex-col items-center gap-1 sm:gap-3 opacity-95 pointer-events-auto">
                        <div class="text-[10px] sm:text-sm font-bold text-white bg-slate-900/90 px-2 py-1 rounded-full border border-slate-600 shadow-lg tracking-widest hidden sm:block">前后 / 左右</div>
                        <div id="joystick-right" class="joystick-container"><div id="thumb-right" class="joystick-thumb"></div></div>
                    </div>
                </div>

                <!-- 声音开关 -->
                <div class="flex flex-col gap-2 items-end pointer-events-auto z-30 pb-2 pr-1 sm:pr-0">
                    <button id="btn-audio" class="hud-badge px-3 py-2 sm:px-4 sm:py-3 hover:bg-white/10 transition flex items-center justify-center gap-2 text-xs sm:text-sm font-bold text-white active:scale-95">
                        <i id="audio-icon" class="fa-solid fa-volume-high text-cyan-400"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 暂停遮罩 -->
    <div id="pause-overlay" class="fixed inset-0 z-40 hidden items-center justify-center select-none pointer-events-auto bg-black/60 backdrop-blur-sm">
        <div class="text-center bg-slate-900/90 p-8 sm:p-12 rounded-2xl border border-slate-600 shadow-2xl">
            <i class="fa-solid fa-pause text-4xl sm:text-6xl text-white mb-4 drop-shadow-lg"></i>
            <h2 class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400 tracking-widest drop-shadow-lg">任务暂停</h2>
            <div class="flex flex-col sm:flex-row gap-4 mt-8 justify-center">
                <button id="btn-resume" class="bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 text-white font-black text-lg sm:text-xl px-8 py-3 rounded-full shadow-[0_0_20px_rgba(6,182,212,0.6)] transition-all transform hover:scale-105 border-2 border-cyan-300 flex items-center justify-center">
                    <i class="fa-solid fa-play mr-2"></i> 继续飞行
                </button>
                <button id="btn-quit" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 text-white font-black text-lg sm:text-xl px-8 py-3 rounded-full shadow-[0_0_20px_rgba(225,29,72,0.6)] transition-all transform hover:scale-105 border-2 border-red-300 flex items-center justify-center">
                    <i class="fa-solid fa-house mr-2"></i> 返回主菜单
                </button>
            </div>
        </div>
    </div>

    <!-- 开始设置浮层 -->
    <div id="modal-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/90 backdrop-blur-md transition-all duration-300 p-2 sm:p-4 pointer-events-auto overflow-y-auto">
        <div class="bg-slate-800 w-full max-w-4xl rounded-2xl border border-slate-600 shadow-2xl flex flex-col p-4 sm:p-8 relative my-auto modal-content">
            <div class="text-center mb-4 sm:mb-6">
                <h1 id="modal-title" class="text-2xl sm:text-4xl font-black text-white tracking-wider mb-1 drop-shadow-md">无人机足球真实模拟</h1>
                <p id="modal-subtitle" class="text-slate-400 text-xs sm:text-sm font-bold tracking-widest">设置飞手代号与参数，迎接极限穿越竞技！</p>
            </div>

            <!-- 参数设置板 -->
            <div id="setup-panel" class="flex flex-col md:flex-row gap-4 sm:gap-6 mb-4 sm:mb-8 bg-slate-900/60 p-4 sm:p-5 rounded-xl border border-slate-700 shadow-inner">
                <div class="flex-1 flex flex-col gap-2">
                    <label class="text-xs sm:text-sm font-bold text-slate-300 uppercase tracking-widest"><i class="fa-solid fa-user-astronaut text-cyan-400 mr-2"></i> 飞行员代号</label>
                    <input type="text" id="player-name-input" placeholder="输入您的名字..." class="custom-input rounded-lg px-3 py-2 font-bold text-base w-full text-center tracking-widest">
                    <p id="name-warning" class="text-red-400 text-xs hidden font-bold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> 必须输入代号！</p>
                </div>
                
                <div class="flex-1 flex flex-col gap-2">
                    <label class="text-xs sm:text-sm font-bold text-slate-300 uppercase flex justify-between tracking-widest">
                        <span><i class="fa-solid fa-stopwatch text-yellow-400 mr-2"></i> 关卡限制时间</span>
                        <span id="time-setting-display" class="text-yellow-400 font-mono text-base font-black">60 秒</span>
                    </label>
                    <div class="flex items-center h-full px-2 mt-2">
                        <input type="range" id="time-slider" min="30" max="180" value="60" step="10" class="w-full">
                    </div>
                </div>

                <div class="flex-1 flex flex-col gap-2">
                    <label class="text-xs sm:text-sm font-bold text-slate-300 uppercase flex justify-between tracking-widest">
                        <span><i class="fa-solid fa-volume-high text-cyan-400 mr-2"></i> 游戏音量</span>
                        <span id="volume-setting-display" class="text-cyan-400 font-mono text-base font-black">100%</span>
                    </label>
                    <div class="flex items-center h-full px-2 mt-2">
                        <input type="range" id="volume-slider" min="0" max="100" value="100" step="5" class="w-full">
                    </div>
                </div>
            </div>

            <!-- 模式选择 -->
            <div id="mode-select-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 mb-4 sm:mb-6">
                <div class="level-card flex flex-col border-cyan-500 selected" id="card-freshman" onclick="selectMode(true)">
                    <div class="card-img-placeholder flex items-center justify-center bg-slate-700">
                        <i class="fa-solid fa-chalkboard-user text-5xl text-white drop-shadow-lg"></i>
                        <div class="absolute bottom-2"><span class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg">新生单关卡体验</span></div>
                    </div>
                    <div class="p-4 flex-1">
                        <h3 class="text-xl font-black text-white mb-2">基础空间飞行训练</h3>
                        <p class="text-sm text-slate-400">固定光环，无风扰，全手动操控。最适合初学者熟悉方向与手感。</p>
                    </div>
                </div>

                <div class="level-card flex flex-col" id="card-full" onclick="selectMode(false)">
                    <div class="card-img-placeholder flex items-center justify-center bg-slate-700">
                        <i class="fa-solid fa-trophy text-5xl text-yellow-400 drop-shadow-lg"></i>
                        <div class="absolute bottom-2"><span class="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg">三关卡职业联赛</span></div>
                    </div>
                    <div class="p-4 flex-1">
                        <h3 class="text-xl font-black text-white mb-2">无人机足球竞技锦标赛</h3>
                        <p class="text-sm text-slate-400">光环距离更远且会动态浮动。需要在限定时间内靠纯操作完成高难度穿越。</p>
                    </div>
                </div>
            </div>

            <!-- 全屏与成绩板区域 -->
            <div class="flex flex-col gap-2">
                <button id="btn-fullscreen" type="button" class="w-full py-2 rounded-xl text-sm font-bold text-slate-300 bg-slate-700 hover:bg-slate-600 border border-slate-500 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-mobile-screen-button"></i> 📳 开启全屏 (推荐手机开启沉浸横屏)
                </button>
                
                <div id="leaderboard-panel" class="hidden flex-col gap-4 bg-slate-900/80 p-4 rounded-xl border border-slate-700">
                    <h3 class="text-xl font-black text-yellow-400 text-center tracking-widest"><i class="fa-solid fa-ranking-star"></i> 英雄排行榜</h3>
                    <div class="overflow-y-auto max-h-48 custom-scrollbar">
                        <table class="w-full text-sm text-center text-slate-300">
                            <thead class="text-xs text-cyan-400 border-b border-slate-600">
                                <tr><th class="pb-2">名次</th><th class="pb-2">代号</th><th class="pb-2">得分</th><th class="pb-2">耗时</th><th class="pb-2">状态</th></tr>
                            </thead>
                            <tbody id="leaderboard-body"></tbody>
                        </table>
                    </div>
                    <button id="btn-export" class="w-full py-2 bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg transition text-sm">
                        <i class="fa-solid fa-file-csv mr-2"></i> 导出成绩单 (CSV)
                    </button>
                </div>

                <!-- 动作控制按钮 -->
                <div class="flex justify-center mt-2 gap-2 sm:gap-4">
                    <button id="btn-back-setup" class="hidden w-1/3 py-3 sm:py-4 rounded-xl text-sm sm:text-lg font-bold tracking-widest bg-slate-600 hover:bg-slate-500 text-white transition">返回设定</button>
                    <button id="btn-start-game" class="gold-btn flex-1 py-3 sm:py-4 rounded-xl text-lg sm:text-xl tracking-widest uppercase">
                        <i class="fa-solid fa-plane-departure mr-2"></i> 确认发射升空
                    </button>
                    <button id="btn-next-level" class="hidden flex-1 py-3 rounded-xl text-lg font-black tracking-widest bg-cyan-600 hover:bg-cyan-500 text-white shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                        前往下一阶段 <i class="fa-solid fa-forward-fast ml-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN GAME SCRIPT -->
    <script>
        class SoundEngine {
            constructor() { 
                this.ctx = null; this.isMuted = false; this.engineOsc = null; this.engineGain = null; 
                this.masterVolume = 1.0; this.unlocked = false;
            }
            init() {
                if (this.unlocked) return;
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();

        function generateRings() {
            // 严谨的内存释放：防止卡顿
            ringsList.forEach(r => {
                if(r.mesh) {
                    scene.remove(r.mesh);
                    r.mesh.traverse(child => { 
                        if (child.isMesh) { 
                            child.geometry.dispose(); 
                            if(child.material.dispose) child.material.dispose(); 
                        }

                }

            ringsList = [];
            let currentZ = 40;
            for (let i = 0; i < CONFIG.RINGS_PER_LEVEL; i++) {
                currentZ += CONFIG.RING_SPACING;
                const ringGroup = new THREE.Group();
                const isFinal = (i === CONFIG.RINGS_PER_LEVEL - 1);

            }
        }

        function setupJoystick(elId, thumbId, stateObj) {
            const el = document.getElementById(elId); const thumb = document.getElementById(thumbId);
            if(!el) return;
            
            const updatePos = (e) => {
                const rect = el.getBoundingClientRect(); 
                const r = rect.width/2 - thumb.offsetWidth/2; 
                let dx = e.clientX - (rect.left + rect.width/2); 
                let dy = e.clientY - (rect.top + rect.height/2);
                const dist = Math.hypot(dx,dy);
                if(dist>r) { dx = (dx/dist)*r; dy = (dy/dist)*r; }
                stateObj.x = dx/r; stateObj.y = dy/r;
                thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.15)`;
            };

            el.addEventListener('pointerdown', (e) => {
                el.setPointerCapture(e.pointerId); stateObj.active = true; stateObj.ptrId = e.pointerId;
                el.classList.add('active'); updatePos(e);
            });
            el.addEventListener('pointermove', (e) => { 
                if (stateObj.active && e.pointerId === stateObj.ptrId) updatePos(e); 
            });
            const endDrag = (e) => {
                if (e.pointerId === stateObj.ptrId) {
                    el.releasePointerCapture(e.pointerId); stateObj.active = false; stateObj.x = 0; stateObj.y = 0; stateObj.ptrId = null;
                    el.classList.remove('active'); thumb.style.transform = 'translate(-50%, -50%) scale(1)';
                }
            };
            el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', endDrag);
        }

        }

        function toggleHover() {

            if(e.key==='ArrowUp') keys.ArrowUp=true; if(e.key==='ArrowDown') keys.ArrowDown=true;
            if(e.key==='ArrowLeft') keys.ArrowLeft=true; if(e.key==='ArrowRight') keys.ArrowRight=true;
            if(e.key===' ') { e.preventDefault(); keys[' ']=true; toggleHover(); } 
            if(e.key.toLowerCase()==='r') resetDrone();
            if(e.key.toLowerCase()==='p') togglePause();
        });
        window.addEventListener('keyup', e => {
            if(e.key.toLowerCase()==='w') keys.w=false; if(e.key.toLowerCase()==='s') keys.s=false;
            if(e.key==='ArrowUp') keys.ArrowUp=false; if(e.key==='ArrowDown') keys.ArrowDown=false;
            if(e.key==='ArrowLeft') keys.ArrowLeft=false; if(e.key==='ArrowRight') keys.ArrowRight=false;
            if(e.key===' ') keys[' ']=false;
        });

        function updatePhysics(delta) {
            //if(!gameState.active || gameState.isPaused) return;
             if (!gameState.active || gameState.isPaused) return;

            totalElapsed += delta;
            gameState.timeLeft -= delta;
            const timeEl = document.getElementById('time-display');
            timeEl.textContent = Math.max(0, gameState.timeLeft).toFixed(1) + 's';
            timeEl.style.color = gameState.timeLeft <= 10 ? '#ef4444' : '#ffffff';
            if(gameState.timeLeft <= 0) { endGame(false); return; }
            if(dronePhysics.hitTimer > 0) dronePhysics.hitTimer -= delta;

            let altInput = (keys.w?1:0) - (keys.s?1:0) - touchInput.left.y;
            let pitchInput = (keys.ArrowUp?1:0) - (keys.ArrowDown?1:0) - touchInput.right.y;
            let rollInput = (keys.ArrowRight?1:0) - (keys.ArrowLeft?1:0) + touchInput.right.x;

            if((Math.abs(altInput)>0.1 || Math.abs(pitchInput)>0.1 || Math.abs(rollInput)>0.1) && dronePhysics.isHovering) toggleHover();

            // 彻底去除自动前进，完全依赖纯手动操作
            const accel = 60 * delta; 
            
            if(dronePhysics.isHovering) {
                dronePhysics.vel.lerp(new THREE.Vector3(0,0,0), 0.1);
                dronePhysics.targetPitch = THREE.MathUtils.lerp(dronePhysics.targetPitch, 0, 0.1);
                dronePhysics.targetRoll = THREE.MathUtils.lerp(dronePhysics.targetRoll, 0, 0.1);
            } else {
                if(Math.abs(pitchInput) > 0.05) {
                    dronePhysics.vel.z += pitchInput * accel * 1.8; 
                    dronePhysics.targetPitch = THREE.MathUtils.lerp(dronePhysics.targetPitch, 0.4 * pitchInput, 0.1);
                } else dronePhysics.targetPitch = THREE.MathUtils.lerp(dronePhysics.targetPitch, 0, 0.1);

                if(Math.abs(rollInput) > 0.05) {
                    dronePhysics.vel.x -= rollInput * accel * 1.5; 
                    dronePhysics.targetRoll = THREE.MathUtils.lerp(dronePhysics.targetRoll, 0.4 * rollInput, 0.1);
                } else dronePhysics.targetRoll = THREE.MathUtils.lerp(dronePhysics.targetRoll, 0, 0.1);

                dronePhysics.vel.y += altInput * accel * 1.5;
            }

            dronePhysics.vel.multiplyScalar(0.95); // 增加一点惯性滑行阻力
            dronePhysics.pos.addScaledVector(dronePhysics.vel, delta);
            
            // 地面碰撞检测与重置逻辑 (触地炸机)
            const groundLimit = CONFIG.DRONE_RADIUS;
            if (dronePhysics.pos.y <= groundLimit + 0.1) {
                // 如果不是在悬停，或者下落速度过快，判定为坠毁炸机
                if (!dronePhysics.isHovering || Math.abs(dronePhysics.vel.y) > 2) {
                    sound.playHit();
                    showToast("💥 警告：发生触地坠毁！已紧急重置回起飞点。");
                    resetDrone(); 
                    return; // 终止本帧计算
                } else {
                    // 平稳降落触地
                    dronePhysics.pos.y = groundLimit;
                    dronePhysics.vel.y = 0;
                }
            }

            dronePhysics.pos.y = Math.max(groundLimit, Math.min(dronePhysics.pos.y, 40));
            dronePhysics.pos.x = Math.max(-42, Math.min(dronePhysics.pos.x, 42));
            dronePhysics.pitch += (dronePhysics.targetPitch - dronePhysics.pitch) * 0.1;
            dronePhysics.roll += (dronePhysics.targetRoll - dronePhysics.roll) * 0.1;
            
            droneGroup.position.copy(dronePhysics.pos);
            droneGroup.rotation.set(dronePhysics.pitch, 0, dronePhysics.roll);
            propellers.forEach((p, idx) => p.rotation.y += (idx%2===0?1:-1)*2.0); // 提升螺旋桨转速观感
            
            const speed = dronePhysics.vel.length();
            gameState.speed = speed * 15;
            camera.position.lerp(dronePhysics.pos.clone().add(new THREE.Vector3(0, 4, -15 - Math.min(speed*0.1, 5))), 0.1);
            camera.lookAt(dronePhysics.pos.clone().add(new THREE.Vector3(0,0,30)));
            sound.updateEngine(Math.min(speed/30, 1));

            document.getElementById('speed-display').textContent = Math.round(gameState.speed);
            document.getElementById('alt-display').textContent = dronePhysics.pos.y.toFixed(1);

            checkCollisions();
        }

        function checkCollisions() {
            if(dronePhysics.hitTimer > 0) return;
            ringsList.forEach(ring => {
                if(!gameState.isFreshmanMode) ring.mesh.position.x = ring.initialPos.x + Math.sin(Date.now()*0.002 + ring.index) * (gameState.level * 3);
                if(ring.passed) return;

                const distZ = Math.abs(dronePhysics.pos.z - ring.mesh.position.z);
                const xyDist = Math.hypot(dronePhysics.pos.x - ring.mesh.position.x, dronePhysics.pos.y - ring.mesh.position.y);

                if(distZ < 3.0) {
                    if(xyDist < CONFIG.RING_RADIUS) {
                        ring.passed = true; gameState.ringsCleared++; gameState.score += 100;
                        ring.torus.material.color.setHex(0x4ade80); ring.inner.material.opacity = 0.5;
                        sound.playPassRing(); updateHUD();
                        if(gameState.ringsCleared >= CONFIG.RINGS_PER_LEVEL) levelComplete();
                    } else if(xyDist < CONFIG.RING_RADIUS + 3.0) {
                        sound.playHit(); dronePhysics.hitTimer = 0.5; dronePhysics.vel.z = -15; 
                        const angle = Math.atan2(dronePhysics.pos.y - ring.mesh.position.y, dronePhysics.pos.x - ring.mesh.position.x);
                        dronePhysics.vel.x = Math.cos(angle) * 15; dronePhysics.vel.y = Math.sin(angle) * 15;
                        const origC = ring.torus.material.color.getHex(); ring.torus.material.color.setHex(0xff0000);
                        setTimeout(() => { if(!ring.passed) ring.torus.material.color.setHex(origC); }, 300);
                    }
                }
            });
        }

        function levelComplete() {

            }
        }
