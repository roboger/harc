<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HARC无人机足球真实模拟挑战</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap');
        
        * { user-select: none; -webkit-user-select: none; }

        body {
            font-family: 'Noto Sans SC', 'Orbitron', sans-serif;
            overflow: hidden; background-color: #0f172a; color: #f3f4f6;
        }

        #canvas-container, #joysticks-layer { touch-action: none; }
        input, #modal-overlay, .modal-content { touch-action: auto; user-select: auto; -webkit-user-select: auto; }

        .top-hud-bar {
            background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0) 100%);
            padding-top: max(15px, env(safe-area-inset-top));
        }

        .hud-badge {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-top: 4px solid #38bdf8;
            border-radius: 6px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }

        .hud-badge::after {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(56, 189, 248, 0.05) 2px, rgba(56, 189, 248, 0.05) 4px);
            pointer-events: none;
        }

        .joystick-container {
            width: 100px; height: 100px;
            background: rgba(15, 23, 42, 0.5);
            border: 3px solid rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(8px); border-radius: 50%;
            position: relative; cursor: crosshair;
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.2);
            transition: border-color 0.1s, box-shadow 0.1s;
        }

        .joystick-thumb {
            width: 40px; height: 40px;
            background: radial-gradient(circle, #fff 0%, #94a3b8 100%);
            border: 3px solid #38bdf8; border-radius: 50%;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none; box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            transition: border-color 0.1s, transform 0.05s ease-out;
        }

        @media (min-width: 640px) {
            .joystick-container { width: 130px; height: 130px; }
            .joystick-thumb { width: 50px; height: 50px; }
        }
        
        .joystick-container.active {
            border-color: #facc15; background: rgba(30, 41, 59, 0.7);
            box-shadow: inset 0 0 30px rgba(250, 204, 21, 0.5), 0 0 20px rgba(250, 204, 21, 0.4);
        }
        
        .joystick-container.active .joystick-thumb {
            border-color: #facc15; background: radial-gradient(circle, #fff 0%, #fde047 100%);
            transform: translate(-50%, -50%) scale(1.1); /* 按下时稍微变大 */
        }

        /* 手机竖屏专项自适应布局 */
        @media (orientation: portrait) {
            .top-hud-bar { flex-wrap: wrap; justify-content: space-between; }
            .hud-left { order: 1; width: 48%; }
            .hud-right { order: 2; width: 48%; display: flex; flex-direction: column; align-items: flex-end; }
            .hud-center { order: 3; width: 100%; margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
            #joysticks-layer { padding-bottom: 15vh; px: 1rem; }
        }

        .level-card {
            background: linear-gradient(135deg, rgba(30,41,59,0.9), rgba(15,23,42,0.95));
            border: 2px solid #475569; border-radius: 12px; transition: all 0.3s ease;
            cursor: pointer; overflow: hidden;
        }
        .level-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3); border-color: #38bdf8; }
        .level-card.selected { border-color: #facc15; box-shadow: 0 0 30px rgba(250, 204, 21, 0.4); }
        .card-img-placeholder { height: 120px; background-size: cover; background-position: center; position: relative; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%;
            background: #facc15; cursor: pointer; margin-top: -10px;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.8); border: 3px solid #fff;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 4px;
        }
        
        .custom-input { background: rgba(0, 0, 0, 0.5); border: 2px solid #475569; color: white; transition: 0.3s;}
        .custom-input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 15px rgba(56,189,248,0.5);}

        .gold-btn {
            background: linear-gradient(180deg, #fef08a 0%, #eab308 100%);
            color: #422006; font-weight: 900; border: 2px solid #fef9c3;
            box-shadow: 0 6px 20px rgba(234, 179, 8, 0.4); transition: all 0.2s;
        }
        .gold-btn:active { transform: translateY(3px); box-shadow: 0 2px 5px rgba(234, 179, 8, 0.4); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden select-none relative">

    <!-- MAIN GAME SCRIPT -->
    <script>
        class SoundEngine {
            constructor() { this.ctx = null; this.isMuted = false; this.engineOsc = null; this.engineGain = null; }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
                
                // 移动端静音解锁黑科技 (强制在同步点击事件内播放缓冲)
                const buffer = this.ctx.createBuffer(1, 1, 22050);
                const source = this.ctx.createBufferSource();
                source.buffer = buffer; source.connect(this.ctx.destination); source.start(0);

                if (this.engineOsc) return; // 避免重复创建引擎声音

                this.engineOsc = this.ctx.createOscillator();
                this.engineGain = this.ctx.createGain();
                this.engineOsc.type = 'sawtooth';
                this.engineOsc.frequency.setValueAtTime(60, this.ctx.currentTime); 
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(320, this.ctx.currentTime);
                this.engineOsc.connect(filter); filter.connect(this.engineGain); this.engineGain.connect(this.ctx.destination);
                this.engineGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                this.engineOsc.start();
            }
            updateEngine(speedRatio) {
                if (!this.ctx || this.isMuted) return;
                const baseFreq = 60 + speedRatio * 80;
                const baseGain = 0.01 + speedRatio * 0.03;
                this.engineOsc.frequency.setTargetAtTime(baseFreq, this.ctx.currentTime, 0.1);
                this.engineGain.gain.setTargetAtTime(baseGain, this.ctx.currentTime, 0.1);
            }
            playBeep(freq, type, duration, vol) {
                if (!this.ctx || this.isMuted) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(vol, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        function createRealisticDrone() {
            droneGroup = new THREE.Group();
            const cageMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });
            const R = CONFIG.DRONE_RADIUS; const tubeR = 0.08;

            }
            const latRadius = R * Math.cos(Math.PI/4); const latY = R * Math.sin(Math.PI/4);
            const topRing = new THREE.Mesh(new THREE.TorusGeometry(latRadius, tubeR, 6, 24), cageMat); topRing.position.y = latY; topRing.rotation.x = Math.PI/2; droneGroup.add(topRing);
            const bottomRing = new THREE.Mesh(new THREE.TorusGeometry(latRadius, tubeR, 6, 24), cageMat); bottomRing.position.y = -latY; bottomRing.rotation.x = Math.PI/2; droneGroup.add(bottomRing);

            const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            const frame1 = new THREE.Mesh(new THREE.BoxGeometry(R*1.6, 0.08, 0.15), frameMat); frame1.rotation.y = Math.PI/4; droneGroup.add(frame1);
            const frame2 = new THREE.Mesh(new THREE.BoxGeometry(R*1.6, 0.08, 0.15), frameMat); frame2.rotation.y = -Math.PI/4; droneGroup.add(frame2);
            
            const core = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 })); droneGroup.add(core);

            propellers = [];
            const propGeo = new THREE.BoxGeometry(1.2, 0.02, 0.12);

            [[R*0.5, R*0.5], [-R*0.5, R*0.5], [R*0.5, -R*0.5], [-R*0.5, -R*0.5]].forEach(pos => {
                const prop = new THREE.Mesh(propGeo, propMat); prop.position.set(pos[0], 0.2, pos[1]);
                droneGroup.add(prop); propellers.push(prop);

            const tailLight = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({color: 0xff0000}));
            tailLight.position.set(0, 0, -R + 0.2); droneGroup.add(tailLight);

        function generateRings() {
            ringsList.forEach(r => {
                if(r.mesh) {

            for (let i = 0; i < CONFIG.RINGS_PER_LEVEL; i++) {

                const isFinal = (i === CONFIG.RINGS_PER_LEVEL - 1);

                const inner = new THREE.Mesh(new THREE.CircleGeometry(CONFIG.RING_RADIUS - 0.5, 16), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.15, side: THREE.DoubleSide }));

                let posX = (Math.random() - 0.5) * 20; let posY = 5 + Math.random() * 10;

                ringsList.push({ mesh: ringGroup, torus: torus, inner: inner, passed: false, index: i, initialPos: new THREE.Vector3(posX, posY, currentZ), isFinal: isFinal });
            }
        }

        // Pointer Events 重写触控摇杆 (解决多指断触)
        function setupJoystick(elId, thumbId, stateObj) {
            const el = document.getElementById(elId); const thumb = document.getElementById(thumbId);
            if(!el) return;
            const updatePos = (e) => {
                const rect = el.getBoundingClientRect(); const r = rect.width/2 - thumb.offsetWidth/2; 
                let dx = e.clientX - (rect.left + rect.width/2); let dy = e.clientY - (rect.top + rect.height/2);
                const dist = Math.hypot(dx,dy);
                if(dist>r) { dx = (dx/dist)*r; dy = (dy/dist)*r; }
                stateObj.x = dx/r; stateObj.y = dy/r;
                thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.1)`;
            };
            el.addEventListener('pointerdown', (e) => {
                el.setPointerCapture(e.pointerId); stateObj.active = true; stateObj.ptrId = e.pointerId;
                el.classList.add('active'); updatePos(e);
            });
            el.addEventListener('pointermove', (e) => { if (stateObj.active && e.pointerId === stateObj.ptrId) updatePos(e); });
            const endDrag = (e) => {
                if (e.pointerId === stateObj.ptrId) {
                    el.releasePointerCapture(e.pointerId); stateObj.active = false; stateObj.x = 0; stateObj.y = 0; stateObj.ptrId = null;
                    el.classList.remove('active'); thumb.style.transform = 'translate(-50%, -50%) scale(1)';
                }
            };
            el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', endDrag);
        }

        function updatePhysics(delta) {
            if(!gameState.active || gameState.isPaused) return;

            gameState.timeLeft -= delta;
            const timeEl = document.getElementById('time-display');
            timeEl.textContent = Math.max(0, gameState.timeLeft).toFixed(1) + 's';
            timeEl.style.color = gameState.timeLeft <= 10 ? '#ef4444' : '#ffffff';
            if(gameState.timeLeft <= 0) { endGame(false); return; }
            if(dronePhysics.hitTimer > 0) dronePhysics.hitTimer -= delta;

            let altInput = (keys.w?1:0) - (keys.s?1:0) - touchInput.left.y;
            let pitchInput = (keys.ArrowUp?1:0) - (keys.ArrowDown?1:0) - touchInput.right.y;
            let rollInput = (keys.ArrowRight?1:0) - (keys.ArrowLeft?1:0) + touchInput.right.x;

            if((Math.abs(altInput)>0.1 || Math.abs(pitchInput)>0.1 || Math.abs(rollInput)>0.1) && dronePhysics.isHovering) toggleHover();

            const accel = 60 * delta; 
            
            if(dronePhysics.isHovering) {
                dronePhysics.vel.lerp(new THREE.Vector3(0,0,0), 0.1);
                dronePhysics.targetPitch = THREE.MathUtils.lerp(dronePhysics.targetPitch, 0, 0.1);
                dronePhysics.targetRoll = THREE.MathUtils.lerp(dronePhysics.targetRoll, 0, 0.1);
            } else {
                // 完全手动飞行逻辑
                if(Math.abs(pitchInput) > 0.05) {
                    dronePhysics.vel.z += pitchInput * accel * 1.8; 
                    dronePhysics.targetPitch = THREE.MathUtils.lerp(dronePhysics.targetPitch, 0.4 * pitchInput, 0.1);
                } else dronePhysics.targetPitch = THREE.MathUtils.lerp(dronePhysics.targetPitch, 0, 0.1);

                if(Math.abs(rollInput) > 0.05) {
                    dronePhysics.vel.x -= rollInput * accel * 1.5; 
                    dronePhysics.targetRoll = THREE.MathUtils.lerp(dronePhysics.targetRoll, 0.4 * rollInput, 0.1);
                } else dronePhysics.targetRoll = THREE.MathUtils.lerp(dronePhysics.targetRoll, 0, 0.1);

                dronePhysics.vel.y += altInput * accel * 1.5;
            }

            dronePhysics.vel.multiplyScalar(0.94); // 阻力减速
            dronePhysics.pos.addScaledVector(dronePhysics.vel, delta);
            dronePhysics.pos.y = Math.max(0.5, Math.min(dronePhysics.pos.y, 40));
            dronePhysics.pos.x = Math.max(-42, Math.min(dronePhysics.pos.x, 42));
            dronePhysics.pitch += (dronePhysics.targetPitch - dronePhysics.pitch) * 0.1;
            dronePhysics.roll += (dronePhysics.targetRoll - dronePhysics.roll) * 0.1;
            
            droneGroup.position.copy(dronePhysics.pos);
            droneGroup.rotation.set(dronePhysics.pitch, 0, dronePhysics.roll);
            propellers.forEach((p, idx) => p.rotation.y += (idx%2===0?1:-1)*1.5); 
            
            const speed = dronePhysics.vel.length();
            gameState.speed = speed * 15;
            camera.position.lerp(dronePhysics.pos.clone().add(new THREE.Vector3(0, 4, -15 - speed*0.1)), 0.1);
            camera.lookAt(dronePhysics.pos.clone().add(new THREE.Vector3(0,0,30)));
            sound.updateEngine(Math.min(speed/30, 1));

            document.getElementById('speed-display').textContent = Math.round(gameState.speed);
            document.getElementById('alt-display').textContent = dronePhysics.pos.y.toFixed(1);

            checkCollisions();
        }

        function checkCollisions() {
            if(dronePhysics.hitTimer > 0) return;
            ringsList.forEach(ring => {
                if(!gameState.isFreshmanMode) ring.mesh.position.x = ring.initialPos.x + Math.sin(Date.now()*0.002 + ring.index) * (gameState.level * 3);
                if(ring.passed) return;

                const distZ = Math.abs(dronePhysics.pos.z - ring.mesh.position.z);
                const xyDist = Math.hypot(dronePhysics.pos.x - ring.mesh.position.x, dronePhysics.pos.y - ring.mesh.position.y);

                if(distZ < 3.0) {
                    if(xyDist < CONFIG.RING_RADIUS) {
                        ring.passed = true; gameState.ringsCleared++; gameState.score += 100;
                        ring.torus.material.color.setHex(0x4ade80); ring.inner.material.opacity = 0.5;
                        sound.playPassRing(); updateHUD();
                        if(gameState.ringsCleared >= CONFIG.RINGS_PER_LEVEL) levelComplete();
                    } else if(xyDist < CONFIG.RING_RADIUS + 3.0) {
                        sound.playHit(); dronePhysics.hitTimer = 0.5; dronePhysics.vel.z = -15; 
                        const angle = Math.atan2(dronePhysics.pos.y - ring.mesh.position.y, dronePhysics.pos.x - ring.mesh.position.x);
                        dronePhysics.vel.x = Math.cos(angle) * 15; dronePhysics.vel.y = Math.sin(angle) * 15;
                        const origC = ring.torus.material.color.getHex(); ring.torus.material.color.setHex(0xff0000);
                        setTimeout(() => { if(!ring.passed) ring.torus.material.color.setHex(origC); }, 300);
                    }
                }
            });
        }

        function updateHUD() {
            document.getElementById('score-display').textContent = gameState.score;
            document.getElementById('rings-count').textContent = gameState.ringsCleared;
            document.getElementById('ring-progress-bar').style.width = `${(gameState.ringsCleared/CONFIG.RINGS_PER_LEVEL)*100}%`;
            document.getElementById('stage-display').textContent = `${gameState.level}/${gameState.isFreshmanMode ? 1 : 3}`;
        }

        function levelComplete() {
            gameState.active = false; sound.playLevelUp();
            gameState.score += Math.floor(gameState.timeLeft) * 20; 
            if(gameState.isFreshmanMode || gameState.level >= 3) {
                endGame(true);
            } else {
                gameState.level++; gameState.ringsCleared = 0;
                document.getElementById('setup-panel').classList.add('hidden');
                document.getElementById('mode-select-container').classList.add('hidden');
                document.getElementById('leaderboard-panel').classList.add('hidden');
                document.getElementById('modal-title').textContent = `关卡 ${gameState.level-1} 突破完成！`;
                document.getElementById('modal-subtitle').innerHTML = `获得时间奖励积分，准备进入更难的关卡 ${gameState.level}`;
                document.getElementById('btn-start-game').classList.add('hidden');
                document.getElementById('btn-back-setup').classList.add('hidden');
                document.getElementById('btn-fullscreen').classList.add('hidden');
                document.getElementById('btn-next-level').classList.remove('hidden');
                document.getElementById('modal-overlay').classList.remove('hidden');
            }
        }

        function endGame(success) {
            gameState.active = false; if(!success) sound.playHit();
            
            // 结算并存入排行榜
            const finalTime = (gameState.baseTimeLimit - Math.max(0, gameState.timeLeft)).toFixed(1);
            leaderboard.push({ name: gameState.playerName, score: gameState.score, time: finalTime, status: success ? '通关' : '失败' });
            leaderboard.sort((a, b) => b.score - a.score);

            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = success ? '竞速挑战成功！' : '时间耗尽，行动失败';
            document.getElementById('modal-title').className = success ? "text-2xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600 tracking-wider mb-2 drop-shadow-md" : "text-2xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-rose-600 tracking-wider mb-2 drop-shadow-md";
            
            document.getElementById('setup-panel').classList.add('hidden');
            document.getElementById('mode-select-container').classList.add('hidden');
            document.getElementById('btn-fullscreen').classList.add('hidden');
            document.getElementById('btn-next-level').classList.add('hidden');
            
            // 渲染排行榜表格内容
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            leaderboard.forEach((entry, idx) => {
                const rank = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : idx + 1;
                const statusColor = entry.status === '通关' ? 'text-green-400' : 'text-red-400';
                tbody.innerHTML += `
                    <tr class="border-b border-slate-700/50">
                        <td class="py-2">${rank}</td>
                        <td class="py-2 font-bold text-white">${entry.name}</td>
                        <td class="py-2 text-yellow-400 font-mono">${entry.score}</td>
                        <td class="py-2">${entry.time}s</td>
                        <td class="py-2 ${statusColor}">${entry.status}</td>
                    </tr>
                `;
            });

            // 展现排行榜与控制按钮
            document.getElementById('leaderboard-panel').classList.remove('hidden');
            document.getElementById('leaderboard-panel').classList.add('flex');
            
            document.getElementById('btn-start-game').innerHTML = '<i class="fa-solid fa-rotate-right mr-2"></i> 再次挑战';
            document.getElementById('btn-start-game').classList.remove('hidden');
            document.getElementById('btn-back-setup').classList.remove('hidden');

            modal.classList.remove('hidden');
            if(success) confetti({particleCount: 150, spread: 80, origin: {y:0.6}, colors: ['#facc15', '#38bdf8', '#fb7185']});
        }
        
        // 绑定返回设置按钮
        document.getElementById('btn-back-setup').addEventListener('click', () => {
            document.getElementById('leaderboard-panel').classList.add('hidden');
            document.getElementById('leaderboard-panel').classList.remove('flex');
            document.getElementById('setup-panel').classList.remove('hidden');
            document.getElementById('mode-select-container').classList.remove('hidden');
            document.getElementById('btn-fullscreen').classList.remove('hidden');
            document.getElementById('btn-start-game').innerHTML = '<i class="fa-solid fa-plane-departure mr-2"></i> 发射升空';
            document.getElementById('btn-back-setup').classList.add('hidden');
            document.getElementById('modal-title').textContent = '无人机足球真实模拟竞技';
            document.getElementById('modal-title').className = 'text-2xl sm:text-4xl font-black text-white tracking-wider mb-1 drop-shadow-md';
        });

        // 绑定成绩单导出功能
        document.getElementById('btn-export').addEventListener('click', () => {
            if(leaderboard.length === 0) return;
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // 加入BOM头防中文乱码
            csvContent += "排名,飞行员代号,总得分,耗时(秒),状态\n";
            leaderboard.forEach((row, index) => {
                csvContent += `${index + 1},${row.name},${row.score},${row.time},${row.status}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "HARC_Drone_Leaderboard.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("成绩单 CSV 已成功导出！");
        });
        
        document.getElementById('btn-next-level').addEventListener('click', () => {
            gameState.timeLeft = gameState.baseTimeLimit;
            gameState.active = true; gameState.isPaused = false;
            document.getElementById('modal-overlay').classList.add('hidden');
            resetDrone(); generateRings(); updateHUD();
        });

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics(Math.min(clock.getDelta(), 0.1));
            if(gameState.isPaused && droneGroup) propellers.forEach((p, idx) => p.rotation.y += (idx%2===0?1:-1)*0.05); 
            renderer.render(scene, camera);
        }

        window.onload = () => { initThreeScene(); selectMode(false); animate(); };
    </script>
</body>
</html>
